# Builds the example app for the iOS Simulator on every PR and push to main.
#
# The build resolves Cloneable-iOS-SDK from its public tag, so this is the
# end-to-end check that the manifest, release asset URLs, checksums and binary
# slices all work for a consumer. The SDK release workflow in cloneable-monorepo
# opens a PR here for each new version and waits for this check to go green.
#
# GitHub-hosted macOS: free for public repos, and it keeps fork PRs off the
# org's Depot runners (which would need "Allow public repositories" enabled).
#
# ARCHS=arm64: the SDK ships arm64-only simulator slices; a generic simulator
# build would also try x86_64 and fail with "unsupported Swift architecture".

name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -n1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Resolve the Cloneable iOS SDK package
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project cloneable-example-app.xcodeproj -scheme cloneable-example-app \
            -clonedSourcePackagesDirPath SourcePackages
          cat cloneable-example-app.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild -project cloneable-example-app.xcodeproj -scheme cloneable-example-app \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages -derivedDataPath DerivedData \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet build
          APP=$(find DerivedData/Build/Products -maxdepth 2 -name 'cloneable-example-app.app' | head -1)
          [ -n "$APP" ] || { echo "::error::no cloneable-example-app.app produced"; exit 1; }
          echo "Built $APP with $(ls "$APP/Frameworks" | wc -l | tr -d ' ') embedded frameworks"
